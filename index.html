<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Todo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Auth Container (Hidden for now) -->
        <div id="auth-container" class="auth-container hidden">
            <div class="auth-box">
                <h1 class="app-title">Minimal Todo</h1>
                <!-- Email Step -->
                <div id="email-step" class="auth-step">
                    <h2>Sign in with magic code</h2>
                    <p class="auth-subtitle">We'll send you a code to sign in</p>
                    <form id="email-form" class="auth-form">
                        <input type="email" id="email" placeholder="Enter your email" class="auth-input" required>
                        <button type="submit" id="send-code-btn" class="auth-button">Send Code</button>
                    </form>
                </div>

                <!-- Code Step -->
                <div id="code-step" class="auth-step hidden">
                    <h2>Enter your code</h2>
                    <p class="auth-subtitle">We sent a code to <span id="sent-email"></span></p>
                    <form id="code-form" class="auth-form">
                        <input type="text" id="code-input" placeholder="Enter 6-digit code" class="auth-input" maxlength="6" pattern="[0-9]{6}" required>
                        <button type="submit" id="verify-code-btn" class="auth-button">Verify Code</button>
                    </form>
                    <button id="back-to-email" class="link-button">Use a different email</button>
                </div>
            </div>
        </div>

        <!-- Main App Container -->
        <div id="main-container" class="main-container">
            <header class="app-header">
                <h1 class="header-title">My Todos</h1>
                <button id="signout-btn" class="signout-btn">Sign Out</button>
            </header>

            <main class="todo-container">
                <div id="empty-state" class="empty-state hidden">
                    <p>No todos yet. Click the + button to add your first task!</p>
                </div>
                <ul id="todo-list" class="todo-list">
                    <!-- Todos will be dynamically inserted here -->
                </ul>
            </main>

            <!-- Floating Add Button -->
            <button id="add-btn" class="add-btn" aria-label="Add new todo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <!-- Add Todo Modal -->
            <div id="add-modal" class="modal hidden">
                <div class="modal-overlay"></div>
                <div class="modal-content">
                    <h3>Add New Todo</h3>
                    <input type="text" id="new-todo-input" class="todo-input" placeholder="What needs to be done?" autofocus>
                    <div class="modal-actions">
                        <button id="cancel-add" class="btn-secondary">Cancel</button>
                        <button id="confirm-add" class="btn-primary">Add</button>
                    </div>
                </div>
            </div>

            <!-- Edit Todo Modal -->
            <div id="edit-modal" class="modal hidden">
                <div class="modal-overlay"></div>
                <div class="modal-content">
                    <h3>Edit Todo</h3>
                    <input type="text" id="edit-todo-input" class="todo-input" placeholder="Update your todo">
                    <div class="modal-actions">
                        <button id="delete-todo" class="btn-danger">Delete</button>
                        <button id="cancel-edit" class="btn-secondary">Cancel</button>
                        <button id="confirm-edit" class="btn-primary">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <script src="https://unpkg.com/@instantdb/core"></script> -->
    <script src="app-simple.js"></script>
</body>
</html>
